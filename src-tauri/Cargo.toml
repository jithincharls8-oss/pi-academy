[package]
name = "pi-academy"
version = "0.1.0"
description = "PI Academy desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pi_academy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
